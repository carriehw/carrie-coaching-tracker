name: Install ACC tracker v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-v4.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link v4 UI and logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="v4.css?v=1">'
          js='<script src="v4-core.js?v=1"></script>'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate external JavaScript
        run: node --check v4-core.js
      - name: Commit installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load ACC tracker v4 experience"
          git push
