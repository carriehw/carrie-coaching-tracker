name: Run personalization patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-personalize-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          python .github/scripts/fix_personalize_patch.py
          python .github/scripts/personalize_patch.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'coaching_user_name_v1' in s
          assert 'id="userName"' in s
          assert 'id="welcomeName"' in s
          assert 'UI_POLISH_V3' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Personalize onboarding and polish app copy"
          git push