name: Refresh ACC tracker v4 assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-v4-assets.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh browser asset versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('v4.css?v=1','v4.css?v=2').replace('v4-core.js?v=1','v4-core.js?v=2')
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8').replace("coaching-v11","coaching-v12").replace('v4.css?v=1','v4.css?v=2').replace('v4-core.js?v=1','v4-core.js?v=2')
          sw.write_text(t,encoding='utf-8')
          PY
          node --check v4-core.js
          grep -q 'v4-core.js?v=2' index.html
          grep -q 'coaching-v12' sw.js
      - name: Commit cache refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh ACC tracker v4 browser assets"
          git pull --rebase origin main
          git push
