name: Finalize shared ACC tracker v11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v11.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish logic, historic records and wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('coaching-v10.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const APP_BUILD='2026-09-11-v10';","const APP_BUILD='2026-09-11-v11';",1)
          s=s.replace('step="0.5"','step="0.25"')
          s=s.replace('旅程已經開始，一步一步累積。','每一節，都讓你更接近目標。')
          s=s.replace("if(p>=50)return'已經走過一半，繼續累積。';","if(p>=50)return'已經完成一半，繼續累積。';")
          s=s.replace("return'旅程已經開始，一步一步累積。'","return'每一節，都讓你更接近目標。'")
          oldq="['今日不需要完成所有餘下時數，<strong>專注下一節 Coaching 就好。</strong>','每一次認真聆聽，都在累積你作為 Coach 的能力。🌱','一節一節累積，100 小時會由目標慢慢變成紀錄。💜','持續出現、持續練習。<strong>你比昨天更接近 ACC。</strong>']"
          newq="['今天不用一次完成所有剩餘時數，<strong>專注下一節 Coaching 就好。</strong>','每一次專注聆聽，都在累積你作為 Coach 的能力。🌱','每完成一節，你都離 100 小時更近一步。💜','持續練習，<strong>你正在一步一步靠近 ACC。</strong>']"
          s=s.replace(oldq,newq,1)
          s=s.replace('這兩個數字是你的「起始進度」。補錄過往紀錄不會改動它們；新完成的 Coaching 才會在此基礎上繼續累積。','這兩個數字只代表你開始使用 App 前已完成的進度。補錄過往紀錄不會改動它們；新完成的 Coaching 會由系統自動累積，請不要把新紀錄再手動加進起始進度。',1)

          pat=r'<div class="formSectionTitle sectionGap"><span>02</span><div>過往 Coaching 資料</div></div>.*?<label>Coachee 的 Feedback</label>'
          repl='''<div class="formSectionTitle sectionGap"><span>02</span><div>過往 Coaching 資料</div></div><label>日期 <span class="req">*</span></label><input id="pastDate" type="date" required><label>開始時間（選填）</label><input id="pastTime" type="time"><label>實際 Coaching 時長 <span class="req">*</span></label><select id="pastActual"><option value="30">30 分鐘</option><option value="45">45 分鐘</option><option value="60" selected>1 小時</option><option value="75">1 小時 15 分</option><option value="90">1.5 小時</option><option value="120">2 小時</option></select><label>進行方式</label><select id="pastMode"><option value="online">線上</option><option value="offline">面對面</option><option value="unknown" selected>未記錄</option></select><label>地點／會議連結（選填）</label><input id="pastPlace" placeholder="例如：Zoom／中環咖啡店"><label>Coaching 主題</label><textarea id="pastTopic"></textarea><div class="formSectionTitle sectionGap"><span>03</span><div>時數類別</div></div><label>當時的時數類別</label><div class="seg two" id="pastPaidSeg"><button type="button" id="pastPaidBtn" class="sel" onclick="setPastPaidClass('paid')">付費／交換</button><button type="button" id="pastFreeBtn" onclick="setPastPaidClass('free')">免費</button></div><div id="pastPaymentField"><label>付費／交換方式</label><select id="pastPayment"><option>互 Coach 交換</option><option>現金／轉數快</option><option>請飲咖啡</option><option>請食飯</option><option>其他實物／服務交換</option></select></div><div class="inlineNote">這個分類只用來完整保存過往紀錄，不會改動你目前的總時數或付費時數。要修正起始時數，請到「設定」。</div><div class="formSectionTitle sectionGap"><span>04</span><div>錄音與同意</div></div><label>錄音／錄影</label><select id="pastRec"><option value="未記錄" selected>未記錄</option><option value="沒有">沒有</option><option value="錄音">有錄音</option><option value="錄影">有錄影</option></select><label>如有錄音／錄影，對方是否已同意？</label><select id="pastConsent"><option>不適用</option><option>是</option><option>否</option></select><div class="formSectionTitle sectionGap"><span>05</span><div>Feedback 與反思</div></div><label>Coachee 的 Feedback</label>'''
          s,n=re.subn(pat,lambda m:repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Could not rebuild historic record fields')

          s=s.replace("function newPastRecord(){$('pastForm').reset();$('pastActual').value='60';setPastPaidClass('paid');show('past')}","function newPastRecord(){$('pastForm').reset();$('pastActual').value='60';$('pastMode').value='unknown';$('pastRec').value='未記錄';$('pastConsent').value='不適用';setPastPaidClass('paid');show('past')}",1)
          pat=r"\$\('pastForm'\)\.onsubmit=e=>\{.*?show\('pastSaved'\)\};"
          repl="""$('pastForm').onsubmit=e=>{e.preventDefault();let a={id:'past-'+Date.now(),status:'done',origin:'past',countTowardsTotals:false,name:$('pastName').value.trim(),phone:$('pastPhone').value.trim(),job:$('pastJob').value.trim(),date:$('pastDate').value,time:$('pastTime').value,actual:num($('pastActual').value),mode:$('pastMode').value,place:$('pastPlace').value.trim(),topic:$('pastTopic').value.trim(),paidClass:pastPaidClass,payment:pastPaidClass==='paid'?$('pastPayment').value:'免費',feedback:$('pastFeedback').value.trim(),reflection:$('pastReflection').value.trim(),rec:$('pastRec').value,consent:$('pastConsent').value,createdAt:new Date().toISOString()};state.items.unshift(a);save();show('pastSaved')};"""
          s,n=re.subn(pat,lambda m:repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Could not update historic submit handler')
          s=s.replace("${a.mode?(a.mode==='online'?'線上':'面對面'):(a.paidClass==='paid'?'付費／交換':'免費')}","${a.mode&&a.mode!=='unknown'?(a.mode==='online'?'線上':'面對面'):(a.paidClass==='paid'?'付費／交換':'免費')}",1)

          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8').replace('coaching-v10.css?v=10','coaching-v10.css?v=11').replace('coaching-v10.js?v=10','coaching-v10.js?v=11')
          idx.write_text(h,encoding='utf-8')
          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8').replace("coaching-v12","coaching-v13").replace('coaching-v10.css?v=10','coaching-v10.css?v=11').replace('coaching-v10.js?v=10','coaching-v10.js?v=11')
          sw.write_text(w,encoding='utf-8')
          PY
          node --check coaching-v10.js
          grep -q 'APP_BUILD=.2026-09-11-v11' coaching-v10.js
          grep -q 'id="pastTime"' coaching-v10.js
          grep -q 'id="pastMode"' coaching-v10.js
          grep -q 'id="pastRec"' coaching-v10.js
          grep -q "countTowardsTotals:false" coaching-v10.js
          grep -q 'coaching-v10.js?v=11' index.html
      - name: Verify counting rules
        shell: bash
        run: |
          node - <<'NODE'
          const h=m=>m/60;
          const openingTotal=15, openingPaid=10;
          const items=[
            {origin:'past',countTowardsTotals:false,status:'done',actual:60,paidClass:'paid'},
            {origin:'new',countTowardsTotals:true,status:'done',actual:60,paidClass:'paid'},
            {origin:'new',countTowardsTotals:true,status:'done',actual:60,paidClass:'free'}
          ];
          const counted=items.filter(x=>x.status==='done'&&x.origin!=='past'&&x.countTowardsTotals!==false);
          const total=openingTotal+counted.reduce((s,x)=>s+h(x.actual),0);
          const paid=openingPaid+counted.filter(x=>x.paidClass==='paid').reduce((s,x)=>s+h(x.actual),0);
          if(total!==17||paid!==11||total-paid!==6) throw new Error(`counting failed ${total}/${paid}`);
          console.log('Counting QA passed: total 17, paid 11, free 6; historic backfill did not add hours.');
          NODE
      - name: Commit finalized version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coaching-v10.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Finalize shared ACC tracker v11"
          git pull --rebase origin main
          git push
