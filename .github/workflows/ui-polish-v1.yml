name: Mobile UX polish v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-polish-v1.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish mobile layout and form UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
/* UI_POLISH_V1 */
html,body{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{background:#f7f6fb}
.app{width:100%;max-width:520px;padding:calc(18px + env(safe-area-inset-top)) 16px calc(82px + env(safe-area-inset-bottom))}
.card{border:1px solid #ece8f2;border-radius:24px;padding:18px 16px 20px;box-shadow:0 8px 28px rgba(63,48,100,.055)}
.support{border-radius:20px;padding:14px 15px;color:#3f3947;background:linear-gradient(135deg,#f8e3eb,#eee9ff);border:1px solid #eee6f4}
label{font-size:14px;line-height:1.3;margin:15px 0 8px;color:#25212b;letter-spacing:.01em}
input,select,textarea{display:block;width:100%;max-width:100%;min-width:0;border:1.5px solid #dfdbe7;background:#fff;border-radius:16px;color:#211d27;font-size:16px;line-height:1.25;box-shadow:0 1px 0 rgba(41,29,70,.02);-webkit-tap-highlight-color:transparent}
input,select{height:54px;min-height:54px;padding:0 14px}
textarea{min-height:108px;padding:14px;line-height:1.5}
input::placeholder,textarea::placeholder{color:#98939e;opacity:1}
input:focus,select:focus,textarea:focus{border-color:#8f7bea;box-shadow:0 0 0 4px rgba(114,91,226,.10)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:54px;height:54px;padding:0 14px;background:#fff}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:20px}
select{-webkit-appearance:auto;appearance:auto;padding-right:34px}
#apptForm .two:not(.seg){grid-template-columns:1fr;gap:0}
#apptForm .seg{grid-template-columns:1fr 1fr;gap:10px}
.seg button{min-height:50px;border-radius:15px;border:1.5px solid #ded9e8;background:#fff;color:#4b4652;font-size:15px}
.seg button.sel{background:linear-gradient(135deg,#6f57df,#7a63e5);border-color:#6f57df;color:#fff;box-shadow:0 6px 14px rgba(111,87,223,.18)}
.formSectionTitle{display:flex;align-items:center;gap:11px;margin:5px 0 12px;padding:11px 12px;border-radius:16px;background:#f7f4ff;border:1px solid #ece6fb;color:#3f3658}
.formSectionTitle>span{display:grid;place-items:center;flex:0 0 30px;width:30px;height:30px;border-radius:10px;background:#e9e2ff;color:#6751cf;font-size:12px;font-weight:900}
.formSectionTitle b{display:block;font-size:14px}
.formSectionTitle small{display:block;margin-top:2px;color:#827a8d;font-size:11px;font-weight:600}
.formSectionTitle.sectionGap{margin-top:24px}
#apptForm>.formSectionTitle:first-child{margin-top:0}
#completeForm .formSectionTitle{margin-top:22px}
#completeForm .formSectionTitle:first-child{margin-top:0}
.btn{min-height:50px;border-radius:16px;font-size:15px}
.primary{background:linear-gradient(135deg,#6e55de,#8d78ea)}
.head{margin-bottom:16px}.head h2{font-size:22px}.back{box-shadow:0 3px 12px rgba(52,39,92,.06)}
.tabs{padding:5px 10px calc(5px + env(safe-area-inset-bottom));border-top:1px solid #ebe7f0;box-shadow:0 -7px 24px rgba(45,35,76,.05)}
.tab{min-height:50px;padding:4px 2px;font-size:11px;border-radius:14px}
.tab b{height:22px;display:grid;place-items:center;margin:0 auto 2px;font-size:0}
.tab svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:#654fd2;background:#f6f3ff}
.stats{gap:10px}.stat{padding:14px 7px;border-radius:19px}
.item{border-radius:20px;padding:16px}
#records .seg{gap:10px}
@media(max-width:380px){.app{padding-left:13px;padding-right:13px}.heroRow{align-items:flex-start}.ring{width:92px;height:92px}.ring:after{width:70px;height:70px}.hero h2{font-size:21px}.stats{gap:7px}.stat b{font-size:20px}}
'''
          if '/* UI_POLISH_V1 */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          # Appointment form grouping
          marker = '<form id="apptForm" class="card">'
          if marker in s and 'Coachee 基本資料</b>' not in s:
              s = s.replace(marker, marker + '<div class="formSectionTitle"><span>01</span><div><b>Coachee 基本資料</b><small>先記低對方嘅基本資料</small></div></div>', 1)
          target = '<label>日期 <span class="req">*</span></label>'
          if target in s and '預約安排</b>' not in s:
              s = s.replace(target, '<div class="formSectionTitle sectionGap"><span>02</span><div><b>預約安排</b><small>日期、時間同進行方式</small></div></div>' + target, 1)
          target = '<label>預計談話主題（選填）</label>'
          if target in s and '談話準備</b>' not in s:
              s = s.replace(target, '<div class="formSectionTitle sectionGap"><span>03</span><div><b>談話準備</b><small>有方向就記低，未有都可以留空</small></div></div>' + target, 1)

          # Completion form grouping
          marker = '<form id="completeForm" class="card">'
          if marker in s and '今次 Coaching</b>' not in s:
              s = s.replace(marker, marker + '<div class="formSectionTitle"><span>01</span><div><b>今次 Coaching</b><small>記錄實際時數同主題</small></div></div>', 1)
          target = '<label>錄音／錄影</label>'
          if target in s and '錄音與同意</b>' not in s:
              s = s.replace(target, '<div class="formSectionTitle"><span>02</span><div><b>錄音與同意</b><small>如有錄音／錄影，記得確認同意</small></div></div>' + target, 1)
          target = '<label>Coachee 給你的 Feedback</label>'
          if target in s and 'Feedback 與反思</b>' not in s:
              s = s.replace(target, '<div class="formSectionTitle"><span>03</span><div><b>Feedback 與反思</b><small>累積你嘅成長同未來 profile 素材</small></div></div>' + target, 1)
          target = '<label>付費形式 <span class="req">*</span></label>'
          if target in s and '交換／付費紀錄</b>' not in s:
              s = s.replace(target, '<div class="formSectionTitle"><span>04</span><div><b>交換／付費紀錄</b><small>清楚記低今次嘅交換方式</small></div></div>' + target, 1)

          # Replace platform-dependent nav glyphs with consistent SVG icons
          old_nav = '<nav class="tabs"><button class="tab active" data-s="home" onclick="show(\'home\')"><b>⌂</b>主頁</button><button class="tab" data-s="records" onclick="show(\'records\')"><b>▣</b>預約</button><button class="tab" data-s="stats" onclick="show(\'stats\')"><b>▥</b>統計</button><button class="tab" data-s="settings" onclick="show(\'settings\')"><b>⚙</b>設定</button></nav>'
          new_nav = '''<nav class="tabs">
<button class="tab active" data-s="home" onclick="show('home')"><b><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg></b>主頁</button>
<button class="tab" data-s="records" onclick="show('records')"><b><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2.5"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/></svg></b>預約</button>
<button class="tab" data-s="stats" onclick="show('stats')"><b><svg viewBox="0 0 24 24"><path d="M5 19V10M12 19V5M19 19v-7"/></svg></b>統計</button>
<button class="tab" data-s="settings" onclick="show('settings')"><b><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.08-1l2-1.5-2-3.4-2.45 1A7 7 0 0 0 14.7 6L14.4 3h-4.8l-.3 3a7 7 0 0 0-1.77 1.1l-2.45-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .34.03.67.08 1l-2 1.5 2 3.4 2.45-1A7 7 0 0 0 9.3 18l.3 3h4.8l.3-3a7 7 0 0 0 1.77-1.1l2.45 1 2-3.4-2-1.5c.05-.33.08-.66.08-1Z"/></svg></b>設定</button>
</nav>'''
          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)

          p.write_text(s, encoding='utf-8')

          # Refresh service-worker cache so iPhone gets the new CSS immediately
          sw = Path('sw.js')
          if sw.exists():
              t = sw.read_text(encoding='utf-8')
              t = re.sub(r"coaching-v\d+", "coaching-v7", t, count=1)
              sw.write_text(t, encoding='utf-8')
          PY

          # Validate inline JavaScript still parses after the HTML edits
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          Path('/tmp/app-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert 'UI_POLISH_V1' in s
          assert '預約安排</b>' in s
          assert 'Feedback 與反思</b>' in s
          PY
          node --check /tmp/app-inline.js

      - name: Commit polished interface
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Polish iPhone forms and navigation UI"
            git push
          fi