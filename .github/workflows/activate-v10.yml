name: Activate ACC tracker v10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-v10.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and activate v10
        shell: bash
        run: |
          node --check coaching-v10.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<link rel="stylesheet" href="v4.css?v=1">','<link rel="stylesheet" href="coaching-v10.css?v=10">')
          s=s.replace('<script src="v4-core.js?v=1"></script>','<script src="coaching-v10.js?v=10"></script>')
          if 'coaching-v10.js?v=10' not in s or 'coaching-v10.css?v=10' not in s:
              raise SystemExit('v10 loader was not installed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit activation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Activate ACC tracker v10"
          git push
