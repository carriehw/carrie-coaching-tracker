name: Patch PIN eye

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-pin-eye.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add PIN visibility toggle and refresh service worker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '<input id="pin" class="pin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••">'
          new = '<div class="pinWrap"><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••"><button type="button" id="pinEye" class="pinEye" aria-label="顯示 PIN" onclick="togglePinVisibility()">👁️</button></div>'
          if old in s:
              s = s.replace(old, new, 1)

          if '.pinWrap{' not in s:
              css = '.pinWrap{position:relative;width:100%}.pinWrap .pin{padding-right:58px}.pinEye{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:12px;background:#f1edfd;color:#514b5f;font-size:20px;display:grid;place-items:center;cursor:pointer}'
              s = s.replace('</style>', css + '</style>', 1)

          if 'function togglePinVisibility()' not in s:
              js = "function togglePinVisibility(){let i=$('pin'),b=$('pinEye');if(!i||!b)return;let show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'🙈':'👁️';b.setAttribute('aria-label',show?'隱藏 PIN':'顯示 PIN')}\n"
              s = s.replace('function prepareLock()', js + 'function prepareLock()', 1)

          p.write_text(s, encoding='utf-8')

          Path('sw.js').write_text("""const C='coaching-v4';const A=['./','./index.html','./manifest.webmanifest','./icon.svg'];self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.addAll(A)))});self.addEventListener('activate',e=>e.waitUntil(Promise.all([caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==C).map(k=>caches.delete(k)))),self.clients.claim()])));self.addEventListener('fetch',e=>{if(e.request.mode==='navigate'){e.respondWith(fetch(e.request,{cache:'no-store'}).then(r=>{let x=r.clone();caches.open(C).then(c=>c.put('./index.html',x));return r}).catch(()=>caches.match('./index.html')))}else{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))}});""", encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix PIN visibility eye and refresh cache"
            git push
          fi